name: Something is missing
description: A thing it should do and does not.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/ontoplano/ontoplano/blob/master/ROADMAP.md)
        first — it lists what is already intended, with the constraints that are
        already decided. If yours is on it, say so in an issue and take it on
        rather than opening a second one.

  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: >
        The thing itself — "track a small business next to the rest of my
        life", "use it in Portuguese".
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do that currently
      description: Optional. Another app, a workaround here, or not at all.

  - type: textarea
    id: idea
    attributes:
      label: How do you think Ontoplano could be changed to do it better
    validations:
      required: true
