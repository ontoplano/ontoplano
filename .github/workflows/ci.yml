# What has to be true of every push and every pull request.
#
# The same commands anybody runs here — there is deliberately no CI-only
# incantation, because a check that only exists in CI is one nobody can
# reproduce when it fails.
#
# One job rather than three: the install and the Playwright browsers are most of
# the wall-clock, and paying for them once beats running the suites in parallel.
name: checks

on:
  push:
    # `master` is this repository's branch; `main` is here for a fork that uses
    # it, so a checks badge is not blank for them.
    branches: [master, main]
  pull_request:

# A second push to the same branch cancels the first. Nobody needs the result
# of the commit they have already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Everything in one job, on two runner cores: the installs, seven checks, a
    # build, the unit suite and 351 browser tests. Twenty was enough until the
    # e2e suite grew past it, and what a job that runs out of time prints is
    # "Error: The operation was canceled." — which reads as somebody cancelling
    # it rather than as a check that never finished. Forty-five leaves room and
    # still catches a hang.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just the one commit.
          #
          # Two generated files name the newest release — the download links on
          # the install page and the badges — and `git describe` is where that
          # name comes from. A shallow clone has no tags, so the generator falls
          # back to "go and find the latest release yourself" and the check then
          # compares that against a page written on a machine that did know.
          # It left `docs:check` red on a green tree, which is the worst kind of
          # red: it says the docs are stale when what is stale is the clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Vite 7 wants 20.19 or newer, and better-sqlite3 is compiled against
          # whatever this is — pinning the major keeps a runner upgrade from
          # being a surprise on an unrelated pull request.
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # prettier and eslint.
      - run: yarn lint

      # The generated docs, regenerated and compared. The PR template asks for
      # `yarn docs` on the honour system; this is the part that is not honour —
      # a branch whose docs do not match its code fails here, including one
      # where the generated files were edited by hand after the fact.
      - run: yarn docs:check

      # Every language has every message, every message means the same thing in
      # each of them, and the generated catalogues match what is in messages/.
      # A branch that adds an English string and no key for the others fails
      # here rather than shipping a screen half in one language.
      - run: yarn messages:check

      # And no screen gained a sentence that cannot be translated. A floor, not
      # a clean sheet: the app is part way through being moved into messages/,
      # and this is what stops that going backwards while it happens.
      - run: yarn copy:check

      # Every changelog line sits under the version this branch ships.
      - run: node scripts/check-changelog.mjs

      # `yarn run check`, not `yarn check`: the second is yarn's own built-in
      # dependency-integrity command, which wins over a script of the same name
      # and passes without ever looking at the types. This step read as a type
      # check for as long as it has existed and was not one.
      - run: yarn run check

      # A plain build, in an environment with nothing configured — which is what
      # a fresh clone is, and what the Docker image build is. The image failed
      # here for a release: better-auth is constructed when its module is
      # imported and refused to exist without a secret, so `yarn build` died
      # while rendering. Nothing else in this file would have caught it; the e2e
      # run builds with a secret in its environment.
      - run: yarn build

      # The scheduled jobs, checked the way the box will load them: `tsx` over
      # a tree installed with `yarn install --production`. A service that
      # imports a dev-only package runs fine everywhere here and fails there,
      # once a minute, in a journal nobody is reading. Actually *running* them
      # in the deployed shape needs the deploy repository's unit files, so that
      # half of the check lives with the deploy tooling rather than here.
      - run: yarn jobs:check

      - run: yarn test:unit

      # Only the browser the suite actually uses. `--with-deps` because a bare
      # runner has none of the shared libraries Chromium needs.
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
