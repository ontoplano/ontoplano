ext {
    minSdkVersion = 23
    // Play refuses a bundle that targets less than 36: "esse nível precisa ser
    // de pelo menos 36 para que o app use as APIs mais recentes". Compiling
    // against the same level is Gradle's own rule — targetSdk may not exceed
    // compileSdk — so the two move together. `tests/android-target.test.ts`
    // holds the floor.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}