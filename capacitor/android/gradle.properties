# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
#
# Capacitor generates this file with 1536m, which is Gradle's own suggestion
# from a decade ago. Three flavours do not sit in it comfortably: the daemon
# spends the build collecting garbage on a machine with ten times that free.
# Raised rather than removed, because a number somebody can lower is better
# than a default nobody can find.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Build the independent parts at once. `make android-all` is three flavours and
# two Capacitor modules, which is the shape this is for.
org.gradle.parallel=true

# Keep the work, so the second build is not the first one again. Three debug
# APKs share their dependencies, their resource processing and most of their
# compilation; without this each one redoes the lot.
org.gradle.caching=true

# And keep the configuration — the part before anything is built at all, where
# every build file, every plugin and the whole Android Gradle Plugin model is
# read again from scratch.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# R classes naming what the module itself declares rather than everything its
# dependencies do: smaller, and quicker to generate.
android.nonTransitiveRClass=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
