<!doctype html>
<html lang="%ontoplano.lang%" data-theme="%ontoplano.theme%" data-style="%ontoplano.style%">
	<head>
		<meta charset="utf-8" />
		<!-- The staging copy wears a marked set of these, so two of this app installed
		     on one phone are not the same picture. `%ontoplano.mark%` is "" or "-staging",
		     filled in by hooks.server.ts. -->
		<!--
			The SVG first for anything that takes one, then the two sizes a tab
			actually shows. A browser handed only a large image shrinks it with a
			filter chosen for speed, which turns a ring one pixel wide into blocks
			of colour; these are drawn at the size they are shown. Both marked
			`sizes`, so the browser picks rather than scales.
		-->
		<link rel="icon" href="%sveltekit.assets%/favicon%ontoplano.mark%.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/icons/favicon-32%ontoplano.mark%.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/icons/favicon-16%ontoplano.mark%.png"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/icons/apple-touch-icon%ontoplano.mark%.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- interactive-widget makes the layout viewport shrink when the software
		     keyboard opens. Without it 100dvh keeps the keyboard's height, so a
		     bottom-sheet form's Save button sits behind the keys. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<!-- Matches the header chrome, so the Android status bar and the app do not
		     meet at a visible seam. -->
		<meta name="theme-color" content="#111827" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="%ontoplano.appname%" />
		<title>%ontoplano.appname%</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
