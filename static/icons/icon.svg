<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    The mark is the board: three columns, work moving left to right.
    Square corners throughout, matching the app's own rule, and the bars use the
    planner, diary and health accents so it reads as the same product.
  -->
  <rect width="512" height="512" fill="#111827"/>
  <g>
    <rect x="128" y="128" width="72" height="176" fill="#1d4ed8"/>
    <rect x="220" y="128" width="72" height="120" fill="#b45309"/>
    <rect x="312" y="128" width="72" height="64"  fill="#0f766e"/>
    <rect x="128" y="336" width="256" height="48" fill="#f2f5fa"/>
  </g>
</svg>
