<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Maskable variant. Android crops this to whatever shape the launcher uses, so
    everything that matters sits inside the centre 80% — the outer ring is
    background it is allowed to eat.
  -->
  <rect width="512" height="512" fill="#111827"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <rect x="128" y="128" width="72" height="176" fill="#1d4ed8"/>
    <rect x="220" y="128" width="72" height="120" fill="#b45309"/>
    <rect x="312" y="128" width="72" height="64"  fill="#0f766e"/>
    <rect x="128" y="336" width="256" height="48" fill="#f2f5fa"/>
  </g>
</svg>
